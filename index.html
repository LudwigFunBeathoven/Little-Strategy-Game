<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klammerfront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --cat-wirtschaft:#7C6A2E; --cat-armee:#9A4A2A; --cat-basis:#3E5866; --cat-automatisierung:#4F6B3A; --cat-sonderregel:#6B4A7A; --gold:#B08A1E;
    --bg:#F1F2ED; --surface:#FBFBF8; --surface-2:#E9EAE3;
    --ink:#1B1E19; --ink-soft:#565A50; --ink-faint:#8B8F84;
    --rule:#DBDCD3; --rule-strong:#C6C8BC;
    --brass:#7C6A2E; --brass-ink:#FBFBF8; --brass-soft:#EFE7D2;
    --steel:#3E5866; --steel-soft:#DEE7EA;
    --rust:#9A4A2A; --rust-soft:#F2E0D6;
    --ground:#BFC1B4; --scrim:rgba(241,242,237,.82);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --cat-wirtschaft:#D2B45C; --cat-armee:#D98A68; --cat-basis:#8FB4C4; --cat-automatisierung:#9CC08A; --cat-sonderregel:#C3A1D6; --gold:#E3C35A;
      --bg:#15170F; --surface:#1C1F17; --surface-2:#262920;
      --ink:#EAEBE3; --ink-soft:#AFB3A5; --ink-faint:#767A6C;
      --rule:#33362A; --rule-strong:#464A38;
      --brass:#D2B45C; --brass-ink:#15170F; --brass-soft:#3A3320;
      --steel:#8FB4C4; --steel-soft:#233238;
      --rust:#D98A68; --rust-soft:#3A2419;
      --ground:#4A4E3E; --scrim:rgba(21,23,15,.82);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --cat-wirtschaft:#D2B45C; --cat-armee:#D98A68; --cat-basis:#8FB4C4; --cat-automatisierung:#9CC08A; --cat-sonderregel:#C3A1D6; --gold:#E3C35A;
    --bg:#15170F; --surface:#1C1F17; --surface-2:#262920;
    --ink:#EAEBE3; --ink-soft:#AFB3A5; --ink-faint:#767A6C;
    --rule:#33362A; --rule-strong:#464A38;
    --brass:#D2B45C; --brass-ink:#15170F; --brass-soft:#3A3320;
    --steel:#8FB4C4; --steel-soft:#233238;
    --rust:#D98A68; --rust-soft:#3A2419;
    --ground:#4A4E3E; --scrim:rgba(21,23,15,.82);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

  .tag{font-family:"IBM Plex Mono", monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--brass);}

  .log{list-style:none; margin:0; padding:0; font-family:"IBM Plex Mono", monospace; font-size:13px; color:var(--ink-faint); min-height:4.4em; display:flex; flex-direction:column; gap:1px;}
  .log li:first-child{color:var(--ink);}
  .log .ts{margin-right:10px; color:var(--ink-faint);}


  .bar{height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .bar > i{display:block; height:100%; width:100%; border-radius:4px; transition:width .15s linear;}
  .bar.thin{height:4px;}
  .bar.steel > i{background:var(--steel);} .bar.rust > i{background:var(--rust);} .bar.brass > i{background:var(--brass);}


  .ph{margin:0; font-family:"IBM Plex Mono", monospace; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;}
  .ph.brass{color:var(--brass);} .ph.steel{color:var(--steel);} .ph.rust{color:var(--rust);} .ph.ink{color:var(--ink-soft);}
  .sub{margin:6px 0 0; font-size:12px; font-weight:600; color:var(--ink-soft); letter-spacing:.02em;}
  .hint{margin:0; font-size:13px; color:var(--ink-faint);}
  .hint[hidden], .sub[hidden]{display:none;}

  .btn-primary{
    background:var(--brass); color:var(--brass-ink); border:none; border-radius:5px;
    padding:14px 16px; font-size:17px; font-weight:600; cursor:pointer;
    display:flex; justify-content:space-between; align-items:baseline;
    transition:transform .06s ease, filter .12s ease; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(.985);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-primary .plus{font-family:"IBM Plex Mono", monospace; font-size:14px; font-weight:500; opacity:.8;}
  .btn-primary{flex-wrap:wrap; row-gap:2px;}
  .btn-primary .expl, .btn-danger .expl{flex-basis:100%; color:inherit; opacity:.8; text-align:left;}
  .btn-ghost, .btn-danger, .seg button{display:inline-flex; flex-direction:column; align-items:flex-start; text-align:left; gap:1px;}
  .btn-ghost .expl, .seg button .expl{font-size:10.5px;}
  .diff .expl{grid-column:1 / -1;}
  /* Erstkontakt-Hinweis (REQ-20.2): höchstens zwei Zeilen, wegklickbar, über allen Fenstern */
  .hintbox{position:fixed; z-index:30; left:50%; bottom:18px; transform:translateX(-50%); width:min(640px, calc(100% - 32px));
           display:flex; gap:14px; align-items:center; justify-content:space-between; padding:12px 14px;
           background:var(--surface); border:1px solid var(--brass); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.16);}
  .hintbox[hidden]{display:none;}
  .hintbox .btn-ghost{flex-shrink:0; white-space:nowrap;}
  .hintbox .hint-body{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .hintbox p{margin:0; font-size:13.5px; line-height:1.4;}


  .opts{display:flex; flex-direction:column; gap:7px;}
  .opt{
    display:grid; grid-template-columns:1fr auto; gap:1px 10px; text-align:left;
    background:var(--surface); border:1px solid var(--rule-strong); border-radius:5px; padding:8px 11px; cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--brass); background:var(--brass-soft);}
  .opt.unit:hover:not(:disabled){border-color:var(--steel); background:var(--steel-soft);}
  .opt:disabled{cursor:default; opacity:.5;}
  .opt[hidden]{display:none;}
  .opt-name{font-weight:600; font-size:14px;}
  .opt-name em{font-style:normal; font-weight:400; color:var(--ink-faint); font-family:"IBM Plex Mono", monospace; font-size:11.5px; margin-left:6px;}
  .opt-name kbd{font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:500; border:1px solid var(--rule-strong); border-radius:3px; padding:0 5px; margin-right:7px; color:var(--ink-soft);}
  .expl{display:block; font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:400; font-variant-numeric:tabular-nums; color:var(--ink-soft); line-height:1.35;}
  .opt .expl{grid-column:1 / -1;}
  .statline{font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--ink-soft);}
  .statline b{color:var(--ink); font-weight:500;}

  /* Modal */
  .modal{position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--scrim);}
  .modal[hidden]{display:none;}
  .card{background:var(--surface); border:1px solid var(--rule-strong); border-radius:8px; padding:24px 26px; width:100%; max-width:460px; display:flex; flex-direction:column; gap:12px; box-shadow:0 12px 40px rgba(0,0,0,.12); max-height:calc(100vh - 32px); overflow-y:auto;}
  .card h2{font-family:"Spectral", Georgia, serif; font-size:26px; margin:0; text-wrap:balance;}
  .card p{margin:0; color:var(--ink-soft);}
  .diffs{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .diff{display:grid; grid-template-columns:1fr auto; gap:2px 12px; text-align:left; padding:12px 14px; border:1px solid var(--rule-strong); border-radius:6px; background:var(--surface); cursor:pointer;}
  .diff:hover{border-color:var(--brass); background:var(--brass-soft);}
  .diff b{font-size:16px;}
  .diff b .rec-tag{font-weight:400; font-size:12px; color:var(--brass); margin-left:8px;}
  .diff .rec{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-faint); align-self:center;}
  .diff span.d{grid-column:1 / -1; font-size:13px; color:var(--ink-soft);}
  #mBody{display:flex; flex-direction:column; gap:14px;}
  #mBody:empty{display:none;}
  #mText:empty{display:none;}
  .seg-lang button{flex:1 1 0; min-width:0;}
  .card-actions{align-items:center; display:flex; justify-content:flex-end; gap:12px; position:sticky; bottom:-24px; background:var(--surface); padding:10px 0 2px;}   /* bleibt sichtbar, wenn der Dialog scrollt */

  footer{font-size:12.5px; color:var(--ink-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  @media (prefers-reduced-motion: reduce){ .btn-primary, .opt, .bar > i{transition:none;} }

  /* Startbildschirm */
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-label{font-family:"IBM Plex Mono", monospace; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .seg{display:flex; gap:6px; flex-wrap:wrap;}
  .seg button{border:1px solid var(--rule-strong); background:var(--surface); border-radius:5px; padding:7px 14px; font-weight:500; cursor:pointer; min-height:32px;}
  .seg button[aria-pressed="true"]{border-color:var(--brass); background:var(--brass-soft);}
  .diff[aria-pressed="true"]{border-color:var(--brass); background:var(--brass-soft);}

  /* Einheitlicher Stil für alles Klickbare (REQ-05) */
  .opt, .btn-primary, .btn-ghost, .seg button, .diff{min-height:32px; min-width:32px; cursor:pointer;}
  .btn-ghost{border:1px solid var(--rule-strong); background:var(--surface); border-radius:5px; padding:5px 12px; font-size:13px; font-family:"IBM Plex Mono", monospace; color:var(--ink-soft); box-shadow:0 1px 0 var(--rule);}
  .btn-ghost:hover{border-color:var(--brass); color:var(--ink);}
  .opt, .seg button, .diff{box-shadow:0 1px 0 var(--rule);}
  .opt:active:not([aria-disabled="true"]), .btn-ghost:active, .seg button:active, .diff:active{transform:translateY(1px); box-shadow:none;}
  [aria-disabled="true"]{opacity:.5; cursor:not-allowed !important;}
  .opt[aria-disabled="true"]:hover{border-color:var(--rule-strong); background:var(--surface);}
  .opt{grid-template-columns:minmax(0, 1fr) auto; align-items:baseline;}
  .opt-name{min-width:0; overflow-wrap:anywhere;}
  .opt-name em{font-style:normal; font-weight:400; color:var(--ink-faint); font-family:"IBM Plex Mono", monospace; font-size:11.5px; margin-left:6px;}

  /* Tooltip */
  #tip{position:fixed; z-index:50; left:0; top:0; max-width:300px; pointer-events:none;
       background:var(--surface); color:var(--ink); border:1px solid var(--rule-strong); border-radius:6px;
       box-shadow:0 8px 24px rgba(0,0,0,.14); padding:10px 12px; font-size:13px; line-height:1.45;
       display:flex; flex-direction:column; gap:6px;}
  #tip[hidden]{display:none;}
  #tip .tt{font-weight:600; font-size:14px;}
  #tip .tb{color:var(--ink-soft);}
  #tip .tr{display:grid; grid-template-columns:1fr auto; gap:2px 14px; font-family:"IBM Plex Mono", monospace; font-size:12px; font-variant-numeric:tabular-nums;}
  #tip .tr span:nth-child(odd){color:var(--ink-faint);}
  #tip .tw{color:var(--rust); font-weight:500;}

  .pick{display:grid; grid-template-columns:1fr auto; gap:2px 12px; text-align:left; padding:10px 14px; border:1px solid var(--rule-strong); border-radius:6px; background:var(--surface); cursor:pointer; box-shadow:0 1px 0 var(--rule); min-height:32px;}
  .pick:hover:not([aria-disabled="true"]){border-color:var(--brass); background:var(--brass-soft);}
  .pick b{font-size:15px;} .pick .c{font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--ink-soft); align-self:center;}
  .pick .d{grid-column:1 / -1; font-size:13px; color:var(--ink-soft);}
  .pick .expl{grid-column:1 / -1;}
  .pick .w{grid-column:1 / -1; font-size:12.5px; color:var(--rust);}
  .pick .nb{grid-column:1 / -1; font-size:12px; color:var(--steel);}
  .pick .nb:empty{display:none;}
  .btn-danger{border:1px solid var(--rust); background:var(--rust); color:var(--surface); border-radius:5px; padding:10px 16px; font-weight:600; cursor:pointer; min-height:32px;}
  .btn-danger:hover{filter:brightness(1.08);}

  /* Stufen & Draft (REQ-02) */
  .chosen{display:flex; flex-wrap:wrap; gap:6px;}
  .chosen .opt-tag{font-size:12.5px; background:var(--surface-2); border-radius:3px; padding:2px 8px; color:var(--ink-soft);}
  .chosen .opt-tag b{font-weight:600; color:var(--ink);}
  .pick .k{font-family:"IBM Plex Mono", monospace; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--brass); align-self:center;}
  /* Spezialkarten (REQ-45): Farbe je Kategorie, Rahmen je Seltenheit */
  .cat-wirtschaft{--cat:var(--cat-wirtschaft);} .cat-armee{--cat:var(--cat-armee);} .cat-basis{--cat:var(--cat-basis);}
  .cat-automatisierung{--cat:var(--cat-automatisierung);} .cat-sonderregel{--cat:var(--cat-sonderregel);}
  .card-pick{border-left:5px solid var(--cat);}
  .card-pick .k{color:var(--cat);}
  .card-pick.rar-rare{border-top:2px solid var(--cat); border-right:2px solid var(--cat); border-bottom:2px solid var(--cat);}
  .card-pick.rar-legendary{border:3px double var(--gold); border-left:5px solid var(--cat); background:var(--brass-soft);}
  .chosen .opt-tag{border-left:4px solid var(--cat);}
  .chosen .opt-tag.rar-rare{box-shadow:inset 0 0 0 1px var(--cat);}
  .chosen .opt-tag.rar-legendary{box-shadow:inset 0 0 0 2px var(--gold);}

  /* REQ-03.5: Klick-Knopf tritt in Phase Spät optisch zurück, bleibt bedienbar */
  .btn-primary.late{background:var(--surface-2); color:var(--ink-soft); padding:8px 14px; font-size:14px;}

  /* Layout Iteration 5 (REQ-5.03): drei Bänder übereinander; Höhen aus config.js (UI.bands) über CSS-Variablen; die Seite scrollt nicht */
  html, body{height:100%;}
  body{overflow:hidden;}
  .app{display:grid; grid-template-rows:var(--band-hud, 72px) var(--band-world, 50vh) var(--band-work, 1fr); height:100vh; overflow:hidden;}
  /* Spielflächen: kein Doppeltipp-Zoom, keine versehentliche Textauswahl (REQ-5.01) */
  .hud, .worldband, .work{touch-action:manipulation; user-select:none; -webkit-user-select:none; min-height:0; min-width:0;}

  /* Band 1: Ressourcenleiste */
  .hud{display:flex; align-items:stretch; gap:0; padding:0 10px; border-bottom:1px solid var(--rule); background:var(--surface); overflow:hidden;}
  .hud-item{display:flex; flex-direction:column; justify-content:center; gap:1px; padding:4px 12px; border-right:1px solid var(--rule); min-width:0; white-space:nowrap;}
  .hud-item[hidden]{display:none;}
  .hud-l{font-family:"IBM Plex Mono", monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .hud-item{position:relative;}
  .hud-item > b{font-size:18px; font-weight:500; line-height:1.1; min-width:4ch;}
  /* Feste Breiten für Zähler: keine Layoutsprünge beim Aktualisieren (REQ-5.10) */
  #material{min-width:7ch;} #xpVal{min-width:6ch;} #hudSoldiers{min-width:5ch;} #clock{min-width:5ch;} #armyState{min-width:7ch;}
  .hud-waves .num{min-width:4.5ch; display:inline-block;} .hud-walls .wall-row b{min-width:4ch;}
  .float{position:absolute; right:10px; top:14px; font-size:12px; font-weight:600; color:var(--brass); pointer-events:none; animation:floatup .9s ease-out forwards;}
  @keyframes floatup{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-16px);}}
  .tabpanel:not([hidden]){animation:tabin .12s ease-out;}
  @keyframes tabin{from{opacity:.4;} to{opacity:1;}}
  /* Kartenwahl (REQ-6.04): Knöpfe blenden während der Eingabesperre ein; Dauer aus UI.draftLockMs */
  @keyframes draftin{from{opacity:.25;} to{opacity:1;}}
  #draftOffer.locked .pick{animation:draftin var(--draft-lock, 400ms) linear both; cursor:default;}
  .pick.preselected{border-color:var(--brass); background:var(--brass-soft);}
  .barracks{margin-top:10px;}
  .toast{position:fixed; z-index:25; left:50%; transform:translateX(-50%); top:calc(var(--band-hud, 64px) + 8px); margin:0; padding:6px 14px;
         background:var(--surface); border:1px solid var(--brass); border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.14); font-size:13.5px;}
  .toast[hidden]{display:none;}
  .res-run .rush{margin-left:8px;}
  @media (prefers-reduced-motion: reduce){ .tabpanel:not([hidden]), .float, .hud-draft{animation:none;} }
  .hud-s{font-size:11.5px; color:var(--ink-soft);}
  .hud-xp{min-width:170px;} .hud-xp .bar{height:5px; margin-top:2px;}
  .hud-waves{display:flex; gap:10px; font-size:16px; font-weight:500;}
  .hud-waves .p{color:var(--steel);} .hud-waves .e{color:var(--rust);}
  .hud .siege{font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:600; color:var(--rust); background:var(--rust-soft); border-radius:3px; padding:0 5px;}
  .hud .siege[hidden]{display:none;}
  .hud-walls .wall-row{display:grid; grid-template-columns:3.2em 52px 3.6em; align-items:center; gap:6px; font-size:11px; line-height:1.25;}
  .hud-walls .wall-row b{font-size:11px; font-weight:500;} .hud-walls .gate{font-weight:600;} .hud-walls .bar{height:4px;}
  .w-n{color:var(--ink-soft);}
  .hud-draft{align-self:center; margin:0 10px; border:2px solid var(--brass); background:var(--brass); color:var(--brass-ink); border-radius:6px; padding:4px 12px; cursor:pointer;
             display:flex; flex-direction:column; align-items:flex-start; font-weight:600; animation:pulse 1.4s ease-in-out infinite;}
  .hud-draft .expl{color:inherit; opacity:.85; font-size:10.5px;}
  .hud-draft[hidden]{display:none;}
  @keyframes pulse{50%{box-shadow:0 0 0 4px var(--brass-soft);}}
  .hud-menu{margin-left:auto; display:flex; gap:6px; align-items:center; padding-left:10px;}
  .hud-menu .btn-ghost{padding:3px 9px; white-space:nowrap;}
  .hud-menu .btn-ghost[hidden]{display:none;}
  .hud-menu .btn-ghost .expl{font-size:10px;}

  /* Band 2: Spielwelt */
  .worldband{display:flex; flex-direction:column; gap:4px; padding:6px 10px 4px;}
  .world .resume[hidden]{display:none;}
  .world .resume{position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); z-index:5; min-width:180px; justify-content:center;}
  .world{flex:1 1 auto; min-height:0; position:relative; background:var(--surface); border:1px solid var(--rule); border-radius:6px; overflow:hidden;}
  #lane{display:block; width:100%; height:100%; cursor:grab; touch-action:none;}
  #lane.dragging{cursor:grabbing;}
  .world-tools{display:flex; align-items:center; gap:10px;}
  .scrollbar{flex:1 1 auto; margin:0; accent-color:var(--steel);}
  .cam button{display:flex; flex-direction:column; align-items:flex-start; padding:1px 9px; min-height:28px;}
  .cam .btn-label{font-weight:600; font-size:12px; line-height:1.2;} .cam .expl{font-size:9.5px;}

  /* Band 3: Arbeitsbereich */
  .work{display:grid; grid-template-columns:minmax(200px, 25%) minmax(0, 1fr); gap:10px; padding:6px 10px 8px; border-top:1px solid var(--rule); background:var(--bg);}
  .work-click{display:flex; flex-direction:column; gap:6px; min-height:0; overflow-y:auto;}
  .work-click .btn-primary{flex:0 0 auto; min-height:72px; font-size:19px;}
  .work-tabs{display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--surface); border:1px solid var(--rule); border-radius:6px;}
  .tabs{display:flex; gap:2px; padding:4px 4px 0; border-bottom:1px solid var(--rule); flex:0 0 auto; overflow-x:auto;}
  .tabs [role="tab"]{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:0; border:1px solid transparent; border-bottom:none; border-radius:5px 5px 0 0;
                    background:transparent; padding:3px 12px 4px; cursor:pointer; min-height:32px; color:var(--ink-soft); transition:background .12s ease;}
  .tabs [role="tab"][hidden]{display:none;}
  .tabs [role="tab"] .btn-label{font-weight:600; font-size:13px;}
  .tabs [role="tab"] .expl{font-size:9.5px;}
  .tabs [role="tab"][aria-selected="true"]{background:var(--surface); border-color:var(--rule); color:var(--ink); margin-bottom:-1px; box-shadow:inset 0 2px 0 var(--brass);}
  .tabs [role="tab"]:hover{color:var(--ink);}
  .tabs .mark{position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--rust);}
  .tabs .mark[hidden]{display:none;}
  .tab-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:8px 12px 10px; display:flex; flex-direction:column; gap:8px;}
  .tabpanel{display:flex; flex-direction:column; gap:8px;}
  .tabpanel[hidden]{display:none;}
  .tabpanel.cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:8px 14px; align-items:start;}
  .tabpanel.cols[hidden]{display:none;}
  .ctx-head{display:flex; flex-direction:column; gap:6px; padding:8px 10px; border:1px solid var(--brass); border-radius:6px; background:var(--brass-soft);}
  .ctx-head[hidden]{display:none;}
  .picks{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:6px;}
  .picks:empty{display:none;}
  .draft-offer{grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));}
  .draft-box{display:flex; flex-direction:column; gap:6px;}
  .draft-box[hidden]{display:none;}
  .opt.selected{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass);}
  /* Universität (REQ-5.07): eine Spalte je Zweig, laufende Forschung mit Fortschrittsbalken */
  .res-tree{display:grid; grid-template-columns:repeat(4, minmax(170px, 1fr)); gap:8px 12px; align-items:start;}
  .res-active{display:flex; flex-direction:column; gap:4px;}
  .res-active:empty{display:none;}
  .res-run{display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:12.5px;}
  .res-run .bar{grid-column:1 / -1; height:5px;}
  #draftTools[hidden], #banTools:empty{display:none;}
  .lanes-preview{display:grid; grid-template-columns:auto 1fr 1fr; gap:2px 10px; font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-soft);}
  .lanes-preview .e{color:var(--rust);} .lanes-preview .p{color:var(--steel);}
  .log{min-height:0; max-height:7.5em; overflow:hidden;}
  .ctx-actions{display:flex; gap:8px; flex-wrap:wrap;}
  #ctxDemolish:empty, #ctxRepair:empty{display:none;}
  #ctxBuilding[hidden], #ctxRepair[hidden]{display:none;}
  .hintbox{bottom:auto; top:calc(var(--band-hud, 72px) + 8px);}
  /* Reiter Bauen (REQ-5.04): Knopfraster links, Kontextkopf rechts */
  .tab-body.side-by-side{display:grid; grid-template-columns:minmax(210px, 250px) minmax(0, 1fr); align-items:start; gap:8px 12px;}
  .tab-body.side-by-side #panel-build{order:-1;}
  .plot-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:4px;}
  .plot-grid button{display:flex; flex-direction:column; align-items:flex-start; gap:0; padding:3px 7px; min-height:40px; border:1px dashed var(--rule-strong);
                    border-radius:5px; background:var(--bg); cursor:pointer; text-align:left;}
  .plot-grid button.built{border-style:solid; background:var(--surface);}
  .plot-grid button[aria-selected="true"]{border:2px solid var(--brass); background:var(--brass-soft);}
  .plot-grid .btn-label{font-weight:600; font-size:12px;} .plot-grid .expl{font-size:10px;}
  /* Tutorial (REQ-T.02): pulsierender Rahmen um das Ziel, Sprechblase; keine Abdunklung, nichts wird gesperrt */
  .tut-target{outline:3px solid var(--brass); outline-offset:2px; animation:tutpulse var(--tut-pulse, .9s) ease-in-out infinite;}
  .hud-item.tut-target, .tabs [role="tab"].tut-target{outline-offset:-3px;}
  @keyframes tutpulse{50%{outline-color:transparent; box-shadow:0 0 0 6px var(--brass-soft);}}
  @media (prefers-reduced-motion: reduce){ .tut-target{animation:none;} }
  /* Markierung „neu“ an frisch freigeschalteten Reitern, Bau-Optionen und Einheiten (REQ-T.05) */
  i.new{font-style:normal; font-family:"IBM Plex Mono", monospace; font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
        background:var(--brass); color:var(--brass-ink); border-radius:3px; padding:0 5px; margin-left:6px; align-self:center; line-height:1.5;}
  i.new[hidden]{display:none;}
  .tabs [role="tab"] i.new{position:absolute; top:2px; right:16px; margin:0;}
  .pick i.new{grid-column:1 / -1; justify-self:start; margin:0;}
  .tut-bubble{position:fixed; z-index:28; left:0; top:0; max-width:var(--tut-bubble-max, 280px); padding:8px 12px; background:var(--brass); color:var(--brass-ink);
              border-radius:8px; font-weight:600; font-size:14px; line-height:1.35; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .tut-bubble[hidden]{display:none;}
  .tut-bubble{display:flex; flex-direction:column; gap:4px; animation:tutfade var(--tut-fade, 180ms) ease-out;}
  .tut-bubble .tb-narr{font-weight:400;}
  .tut-bubble .tb-task{font-weight:700; border-top:1px solid rgba(251,251,248,.4); padding-top:4px;}
  .tut-bubble .tb-narr[hidden], .tut-bubble .tb-task[hidden], .tut-bubble .tb-more[hidden]{display:none;}
  .tut-bubble .tb-task:only-child, .tut-bubble .tb-narr[hidden] + .tb-task{border-top:none; padding-top:0;}
  .tut-bubble .tb-more{font-style:normal; align-self:flex-end; line-height:1; font-size:12px; opacity:.85;}
  .tut-bubble .tb-more::after{content:'\25B8';}
  .tut-bubble.clickable{pointer-events:auto; cursor:pointer;}
  @keyframes tutfade{from{opacity:0;} to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .tut-bubble{animation:none;} }
  .tut-bubble::after{content:''; position:absolute; left:var(--tail-x, 50%); width:10px; height:10px; background:var(--brass); transform:translateX(-50%) rotate(45deg);}
  .tut-bubble.above::after{bottom:-5px;} .tut-bubble.below::after{top:-5px;}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Band 1: Ressourcenleiste (REQ-5.03) -->
  <header class="hud" id="hud">
    <div class="hud-item" data-tooltip="hud:soldiers"><span class="hud-l" data-i18n="hud.soldiers"></span><b class="num" id="hudSoldiers">0/3</b></div>
    <div class="hud-item" data-tooltip="hud:material"><span class="hud-l" data-i18n="hud.material"></span><b class="num" id="material">0</b><span class="hud-s num" id="rate"></span></div>
    <div class="hud-item hud-xp" data-tooltip="hud:xp"><span class="hud-l" data-i18n="hud.xp"></span><b class="num" id="xpVal">0</b>
      <span class="bar brass"><i id="barLvl"></i></span><span class="hud-s num"><span id="xpRate"></span> · <span id="lvlProg"></span></span></div>
    <div class="hud-item" id="hudWaves" data-tooltip="hud:waves"><span class="hud-l" data-i18n="hud.waves"></span>
      <span class="hud-waves"><span class="num p" id="waveIn">0:20</span><span class="num e" id="enemyWaveIn">0:20</span></span><span class="siege num" id="siegeInfo" hidden></span></div>
    <div class="hud-item hud-walls" data-tooltip="hud:walls"><span class="hud-l" data-i18n="hud.walls"></span>
      <span class="wall-row"><span class="w-n" data-i18n="hud.wall0s"></span><span class="bar steel thin"><i id="barP0"></i></span><b class="num" id="hpP0"></b></span>
      <span class="wall-row gate"><span class="w-n" data-i18n="hud.gates"></span><span class="bar steel thin"><i id="barP1"></i></span><b class="num" id="hpP1"></b></span>
      <span class="wall-row"><span class="w-n" data-i18n="hud.wall2s"></span><span class="bar steel thin"><i id="barP2"></i></span><b class="num" id="hpP2"></b></span></div>
    <div class="hud-item" data-tooltip="hud:army"><span class="hud-l" data-i18n="hud.army"></span><b id="armyState"></b></div>
    <div class="hud-item" data-tooltip="hud:time"><span class="hud-l"><span id="diffLabel"></span></span><b class="num" id="clock">0:00</b><span class="hud-s" id="eraLabel"></span></div>
    <button class="hud-draft" id="draftBtn" type="button" data-tooltip="draftBtn" hidden><span class="btn-label" data-i18n="hud.draft"></span><span class="expl"></span></button>
    <div class="hud-menu">
      <button class="btn-ghost" id="tutSkipBtn" type="button" data-tooltip="menu:tutorial" hidden><span class="btn-label" data-i18n="tut.skip"></span><span class="expl" data-i18n="ex.menu.tutorial"></span></button>
      <button class="btn-ghost" id="pauseBtn" type="button" data-tooltip="menu:pause" aria-pressed="false"><span class="btn-label"></span><span class="expl"></span></button>
      <button class="btn-ghost" id="langBtn" type="button" data-tooltip="menu:lang"><span class="btn-label"></span><span class="expl"></span></button>
      <button class="btn-ghost" id="newBtn" type="button" data-tooltip="new"><span class="btn-label" data-i18n="hdr.newGame"></span><span class="expl"></span></button>
      <button class="btn-ghost" id="sessionBtn" type="button" data-tooltip="menu:session" hidden><span class="btn-label" data-i18n="menu.session"></span><span class="expl" data-i18n="ex.menu.session"></span></button>
    </div>
  </header>

  <!-- Band 2: Spielwelt, horizontal scrollbar (REQ-46) -->
  <main class="worldband" id="worldband">
    <div class="world" id="world"><canvas id="lane" tabindex="0" data-tooltip="world"></canvas>
      <button class="btn-primary resume" id="resumeBtn" type="button" data-tooltip="menu:resume" hidden><span class="btn-label"></span><span class="expl"></span></button></div>
    <div class="world-tools">
      <input type="range" id="worldScroll" class="scrollbar" min="0" max="1000" step="1" value="0" data-tooltip="scroll">
      <div class="seg cam">
        <button type="button" id="camRealm" data-tooltip="cam:realm"><span class="btn-label" data-i18n="cam.realm"></span><span class="expl" data-i18n="ex.cam.realm"></span></button>
        <button type="button" id="camFront" data-tooltip="cam:front"><span class="btn-label" data-i18n="cam.front"></span><span class="expl" data-i18n="ex.cam.front"></span></button>
        <button type="button" id="camFollow" data-tooltip="cam:follow" aria-pressed="false"><span class="btn-label" data-i18n="cam.follow"></span><span class="expl" id="camFollowExpl"></span></button>
      </div>
    </div>
  </main>

  <!-- Band 3: Arbeitsbereich, links Klickfeld, rechts Reiter (REQ-5.03) -->
  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  <section class="work" id="work">
    <div class="work-click">
      <button class="btn-primary" id="clickBtn" type="button" data-tooltip="click"><span data-i18n="btn.click"></span> <span class="plus">+<span id="clickHint">1</span></span><span class="expl" id="clickExpl"></span></button>
      <p class="statline num" id="perClick"></p>
      <div class="opts" id="optsFertigung"></div>
    </div>
    <div class="work-tabs">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="tab-body" id="tabBody">
        <div class="ctx-head" id="ctxHead" hidden>
          <h2 class="ph rust" id="ctxTitle"></h2>
          <p class="hint" id="ctxText"></p>
          <div class="picks" id="ctxBuild"></div>
          <div id="ctxBuilding">
            <div class="opts" id="optsKontor"></div>
          </div>
          <div class="opts" id="ctxRepair"></div>
          <div class="ctx-actions" id="ctxDemolish"></div>
        </div>
        <div class="tabpanel" id="panel-build" role="tabpanel">
          <div class="plot-grid" id="plotGrid" role="grid" data-i18n-aria="grid.aria"></div>
          <p class="hint" id="buildHint" data-i18n="panel.build.hint"></p>
          <p class="statline" id="factoryStat"></p>
        </div>
        <div class="tabpanel cols" id="panel-wall" role="tabpanel" hidden>
          <div><h3 class="sub" data-i18n="sub.repair"></h3><div class="opts" id="optsRepair"></div></div>
          <div><h3 class="sub" data-i18n="sub.mauer"></h3><div class="opts" id="optsMauer"></div></div>
          <div><h3 class="sub" data-i18n="sub.turm_0"></h3><div class="opts" id="optsTurm0"></div></div>
          <div><h3 class="sub" data-i18n="sub.turm_2"></h3><div class="opts" id="optsTurm2"></div></div>
        </div>
        <div class="tabpanel cols" id="panel-army" role="tabpanel" hidden>
          <div>
            <div class="opts" id="optsUnits"></div>
            <!-- Kaserne im Reiter Armee (REQ-6.05): Status, Ausbauten; ohne Kaserne ein Weg zum Bauen -->
            <div class="barracks" id="armyKaserne">
              <h3 class="sub" data-i18n="sub.kaserne"></h3>
              <p class="statline" id="kaserneStatus"></p>
              <div class="opts" id="optsKaserne"></div>
              <div class="ctx-actions" id="kaserneBuild"></div>
            </div>
            <div class="statline"><span data-i18n="front.supply"></span> <b id="queue" class="num">0/3</b> · <span data-i18n="front.field"></span> <b id="ownCount" class="num">0</b> · <span data-i18n="front.losses"></span> <b id="losses" class="num">0</b> · <span data-i18n="hdr.kills"></span> <b id="kills" class="num">0</b></div>
          </div>
          <div><div class="lanes-preview" id="wavePreview"></div></div>
          <div><ol class="log" id="log" aria-live="polite"></ol>
            <footer><span id="footVersion"></span> <span data-i18n="foot.save"></span></footer></div>
        </div>
        <div class="tabpanel" id="panel-smithy" role="tabpanel" hidden>
          <p class="hint" id="smithyText"></p>
          <div class="opts" id="optsSchmiede"></div>
        </div>
        <div class="tabpanel" id="panel-uni" role="tabpanel" hidden>
          <p class="hint" id="uniInfo"></p>
          <div class="res-active" id="resActive"></div>
          <div class="res-tree">
            <div><h3 class="sub" data-i18n="research.branch.lehre"></h3><div class="opts" id="resLehre"></div></div>
            <div><h3 class="sub" data-i18n="research.branch.archiv"></h3><div class="opts" id="resArchiv"></div></div>
            <div><h3 class="sub" data-i18n="research.branch.forschung"></h3><div class="opts" id="resForschung"></div></div>
            <div><h3 class="sub" data-i18n="research.branch.freischaltung"></h3><div class="opts" id="resFreischaltung"></div></div>
          </div>
        </div>
        <div class="tabpanel" id="panel-cards" role="tabpanel" hidden>
          <div class="draft-box" id="draftBox" hidden>
            <h2 class="ph brass" id="draftTitle"></h2>
            <p class="hint" id="draftText"></p>
            <div class="picks draft-offer" id="draftOffer"></div>
            <div class="ctx-actions" id="draftTools">
              <button class="btn-ghost" id="rerollBtn" type="button" data-tooltip="reroll"><span class="btn-label" data-i18n="draft.reroll"></span><span class="expl"></span></button>
            </div>
            <div class="ctx-actions" id="banTools"></div>
          </div>
          <h3 class="sub" data-i18n="panel.levels"></h3>
          <div class="chosen" id="chosen"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="tut-bubble" id="tutBubble" role="status" hidden><span class="tb-narr" id="tutBubbleNarr"></span><b class="tb-task" id="tutBubbleTask"></b><i class="tb-more" id="tutBubbleMore" hidden></i></div>

<div class="hintbox" id="hintBox" role="status" aria-live="polite" hidden>
  <div class="hint-body"><p class="tag" id="hintTitle"></p><p id="hintText"></p></div>
  <button class="btn-ghost" id="hintOk" type="button" data-tooltip="hintOk"><span class="btn-label"></span><span class="expl"></span></button>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <p class="tag" id="mEyebrow"></p>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mBody"></div>
    <div class="card-actions" id="mActions"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/en.js"></script>
<script src="data/draft-options.js"></script>
<script src="data/research.js"></script>
<script src="data/neighbors.js"></script>
<script src="data/tutorial-steps.js"></script>
<script src="hints.js"></script>
<script src="tutorial.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="render.js"></script>
<script src="hud.js"></script>
<script src="panels.js"></script>
<script src="tutorial-ui.js"></script>
<script src="session.js"></script>
</body>
</html>
